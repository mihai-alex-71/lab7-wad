name: Lab 7

# 1. Trigger the pipeline only on push to the "test" branch
on:
  push:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # 2 & 4. Run backend tests in the pipeline AND read GitHub secrets
      - name: Run backend tests
        run: ./gradlew test
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}

      # 3. Run the Jacoco report in the pipeline
      - name: Generate Jacoco Report
        run: ./gradlew jacocoTestReport